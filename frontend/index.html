    /* =========================================================================
     * ERROR BOUNDARY FOR GRACEFUL RUNTIME RECOVERY
     * ========================================================================= */
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }

      static getDerivedStateFromError(error) {
        return {
          hasError: true,
          errorMessage: error?.message || 'An unexpected rendering error occurred.',
        };
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-2xl p-6 text-center space-y-4">
                <h2 className="text-lg font-bold text-rose-400">Something went wrong</h2>
                <p className="text-sm text-slate-300">{this.state.errorMessage}</p>
                <button
                  onClick={() => this.setState({ hasError: false, errorMessage: '' })}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold"
                >
                  Reload Interface
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    /* =========================================================================
     * DETERMINISTIC SVG QR GRAPHIC FOR FACULTY LIVE ATTENDANCE CONTROLLER
     * ========================================================================= */
    function SessionQrGraphic({ code }) {
      const seed = parseInt(code, 10) || 4829;
      const cells = [];

      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          const isTopLeft = r < 2 && c < 2;
          const isTopRight = r < 2 && c > 4;
          const isBottomLeft = r > 4 && c < 2;
          const isActive =
            isTopLeft || isTopRight || isBottomLeft || (seed * (r + 3) + c * 17) % 3 !== 0;

          if (isActive) {
            cells.push(
              <rect
                key={`${r}-${c}`}
                x={c * 10 + 5}
                y={r * 10 + 5}
                width="8"
                height="8"
                rx="1.5"
                fill="currentColor"
              />
            );
          }
        }
      }

      return (
        <div className="inline-flex p-2.5 bg-white text-slate-950 rounded-xl shadow-inner border border-slate-300">
          <svg width="78" height="78" viewBox="0 0 80 80" aria-label={`QR Code for OTP ${code}`}>
            {cells}
          </svg>
        </div>
      );
    }

    /* =========================================================================

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [subjects, setSubjects] = useState(INITIAL_SUBJECTS);
      const [timetable] = useState(INITIAL_TIMETABLE);
      const [assignments, setAssignments] = useState(INITIAL_ASSIGNMENTS);
      const [notices, setNotices] = useState(INITIAL_NOTICES);

      // Active Smart Classroom OTP/QR session state
      const [activeSession, setActiveSession] = useState({
        active: true,
        courseCode: 'BCS-301',
        otp: '4829',
        expiresIn: 120,
        markedStudents: [],
      });

      // Interactive input and feedback states
      const [studentOtpInput, setStudentOtpInput] = useState('');
      const [toast, setToast] = useState(null);
      const [selectedCourseForOtp, setSelectedCourseForOtp] = useState('BCS-301');
      const [newNoticeTitle, setNewNoticeTitle] = useState('');
      const [newNoticeCategory, setNewNoticeCategory] = useState('Academic');
      const [newAssignmentTitle, setNewAssignmentTitle] = useState('');
      const [newAssignmentCourse, setNewAssignmentCourse] = useState('BCS-301');

      // Show toast notification banner (never uses browser alert())
      const triggerToast = (message, tone = 'indigo') => {
        setToast({ message, tone });
      };

      // Auto-dismiss toast after 3.5 seconds
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3500);
        return () => clearTimeout(timer);
      }, [toast]);

      // Live 120-second countdown timer for the active attendance session
      useEffect(() => {
        if (!activeSession.active) return;
        const interval = setInterval(() => {
          setActiveSession((prev) => {
            if (prev.expiresIn <= 1) {
              return { ...prev, active: false, expiresIn: 0 };
            }
            return { ...prev, expiresIn: prev.expiresIn - 1 };
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [activeSession.active]);

      // Render minimal Login Page if unauthenticated
      if (!currentUser) {
        return (
          <LoginPage
            onLogin={(user) => {
              setCurrentUser(user);
              setActiveTab('dashboard');
              triggerToast(`Welcome back, ${user.name}!`, 'emerald');
            }}
          />
        );
      }

      // Derived dashboard metrics
      const role = currentUser.role;
      const isMarkedByCurrentUser = activeSession.markedStudents.some(
        (s) => s.id === currentUser.id
      );
      const totalAttended = subjects.reduce((acc, s) => acc + s.attended, 0);
      const totalClasses = subjects.reduce((acc, s) => acc + s.total, 0);
      const overallPercentage =
        totalClasses > 0 ? ((totalAttended / totalClasses) * 100).toFixed(1) : '0.0';
      const pendingAssignmentsCount = assignments.filter((a) => !a.submitted).length;
      const latestNotice = notices[0];

      // Faculty: Generate fresh random 4-digit OTP and restart 120s window
      const handleGenerateOtp = () => {
        const randomOtp = Math.floor(1000 + Math.random() * 9000).toString();
        setActiveSession({
          active: true,
          courseCode: selectedCourseForOtp,
          otp: randomOtp,
          expiresIn: 120,
          markedStudents: [],
        });
        triggerToast(
          `Live OTP ${randomOtp} generated for ${selectedCourseForOtp} (120s window)!`,
          'emerald'
        );
      };

      // Student: Verify presence using 4-digit OTP or simulated QR check-in
      const handleMarkAttendance = (mode = 'otp') => {
        if (!activeSession.active) {
          return triggerToast(
            'Attendance window has expired. Wait for faculty to open a new session.',
            'rose'
          );
        }
        if (isMarkedByCurrentUser) {
          return triggerToast('Your attendance is already recorded for this session.', 'indigo');
        }
        if (mode === 'otp' && studentOtpInput.trim() !== activeSession.otp) {
          return triggerToast(
            `Invalid OTP! Enter the live 4-digit code displayed by faculty (${activeSession.otp}).`,
            'rose'
          );
        }

        setSubjects((prev) =>
          prev.map((sub) =>
            sub.code === activeSession.courseCode
              ? { ...sub, attended: sub.attended + 1, total: sub.total + 1 }
              : sub
          )
        );

        const timestamp = new Date().toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });

        setActiveSession((prev) => ({
          ...prev,
          markedStudents: [
            ...prev.markedStudents,
            {
              id: currentUser.id,
              name: currentUser.name,
              mode: mode.toUpperCase(),
              time: timestamp,
            },
          ],
        }));

        setStudentOtpInput('');
        triggerToast(
          `Attendance verified (${mode.toUpperCase()}) for ${currentUser.name} (${currentUser.id}) in ${activeSession.courseCode}!`,
          'emerald'
        );
      };

      // Student: Upload solution for a pending coursework task
      const handleSubmitAssignment = (id) => {
        setAssignments((prev) =>
          prev.map((a) =>
            a.id === id ? { ...a, submitted: true, grade: 'Submitted (Under Review)' } : a
          )
        );
        triggerToast(`Assignment solution uploaded successfully by ${currentUser.name}!`, 'emerald');
      };

      // Faculty: Publish a new coursework assignment
      const handleCreateAssignment = (e) => {
        e.preventDefault();
        if (!newAssignmentTitle.trim()) return;
        setAssignments((prev) => [
          {
            id: Date.now(),
            code: newAssignmentCourse,
            title: newAssignmentTitle.trim(),
            dueDate: '2026-12-01',
            submitted: false,
            grade: 'Pending',
          },
          ...prev,
        ]);
        setNewAssignmentTitle('');
        triggerToast(`New coursework assignment published for ${newAssignmentCourse}!`, 'emerald');

                      onSubmit={handleCreateAssignment}
                      className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3.5"
                    >
                      <h4 className="font-bold text-white text-sm">
                        Post New Coursework Assignment
                      </h4>
                      <div className="flex flex-col sm:flex-row gap-3">
                        <select
                          value={newAssignmentCourse}
                          onChange={(e) => setNewAssignmentCourse(e.target.value)}
                          className="bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                        >
                          {subjects.map((s) => (
                            <option key={s.code} value={s.code}>
                              {s.code}
                            </option>
                          ))}
                        </select>
                        <input
                          type="text"
                          required
                          value={newAssignmentTitle}
                          onChange={(e) => setNewAssignmentTitle(e.target.value)}
                          placeholder="Enter assignment or lab problem statement..."
                          className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                        />
                        <button
                          type="submit"
                          className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold transition-colors"
                        >
                          Publish Task
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Assignment List */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3.5">
                    <div>
                      <h3 className="font-bold text-white text-base">
                        Coursework & Lab Submissions
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        {role === 'student'
                          ? 'Upload your completed solutions before the due date.'
                          : 'Track active coursework published for B.Tech CSE 3rd Semester.'}
                      </p>
                    </div>

                    {assignments.map((item) => (
                      <div
                        key={item.id}
                        className="bg-slate-950 border border-slate-800/90 p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                      >
                        <div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-md border border-indigo-500/20">
                              {item.code}
                            </span>
                            <span className="text-sm font-semibold text-white">{item.title}</span>
                          </div>
                          <p className="text-xs text-slate-400 mt-1.5">
                            Due: {item.dueDate} • Status:{' '}
                            <span className="text-slate-200">{item.grade}</span>
                          </p>
                        </div>

                        {item.submitted ? (
                          <span className="inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-semibold self-start sm:self-center shrink-0">
                            <Icons.Check />
                            Submitted
                          </span>
                        ) : role === 'student' ? (
                          <button
                            onClick={() => handleSubmitAssignment(item.id)}
                            className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-colors self-start sm:self-center shrink-0"
                          >
                            Upload Solution
                          </button>
                        ) : (
                          <span className="text-xs px-3 py-1.5 rounded-xl bg-amber-500/15 text-amber-300 border border-amber-500/30 font-semibold self-start sm:self-center shrink-0">
                            Pending Submission
                          </span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ===============================================================
               * TAB 5: DIGITAL NOTICE BOARD
               * =============================================================== */}
              {activeTab === 'notices' && (
                <div className="space-y-6">
                  {/* Faculty Notice Broadcast Form */}
                  {role === 'faculty' && (
                    <form
                      onSubmit={handleAddNotice}
                      className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3.5"
                    >
                      <h4 className="font-bold text-white text-sm">
                        Broadcast Departmental Notice
                      </h4>
                      <div className="flex flex-col sm:flex-row gap-3">
                        <select
                          value={newNoticeCategory}
                          onChange={(e) => setNewNoticeCategory(e.target.value)}
                          className="bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                        >
                          <option value="Academic">Academic</option>
                          <option value="Examination">Examination</option>
                          <option value="Technical Event">Technical Event</option>
                          <option value="Urgent">Urgent</option>
                        </select>
                        <input
                          type="text"
                          required
                          value={newNoticeTitle}
                          onChange={(e) => setNewNoticeTitle(e.target.value)}
                          placeholder="Enter official departmental announcement..."
                          className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                        />
                        <button
                          type="submit"
                          className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold transition-colors"
                        >
                          Broadcast
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Notice Feed */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3.5">
                    <div>
                      <h3 className="font-bold text-white text-base">Digital Notice Board</h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Official circulars & updates for IET Lucknow CSE Department
                      </p>
                    </div>

                    {notices.map((n) => (
                      <div
                        key={n.id}
                        className="bg-slate-950 border border-slate-800/90 p-4 rounded-xl space-y-1.5"
                      >
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                            {n.category}
                          </span>
                          <span className="text-sm font-semibold text-white">{n.title}</span>
                        </div>
                        <p className="text-xs text-slate-400">
                          Posted by <span className="text-slate-300 font-medium">{n.author}</span> •{' '}
                          {n.date}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    // Mount React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
